name: unishield_360
description: UniShield 360 - Campus Safety & Wellness Platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.6.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Audio Recording
  record: ^5.0.4
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  
  # Location & Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  
  # Image Handling
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  
  # Utilities
  shared_preferences: ^2.2.2
  permission_handler: ^11.2.0
  shake: ^3.0.0
  vibration: ^2.0.1
  url_launcher: ^6.2.4
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Charts
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
